name: Publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - automas-maafw-interface
          - automas-maafw-agent-env
          - automas-maafw-controller-adb
          - automas-maafw-controller-win32
          - automas-maafw-project-store
          - automas-maafw-project-update
          - automas-maafw-runtime-pool
          - automas-maafw-runner
          - automas-script-maafw
          - automas-script-maafw-managed

permissions:
  contents: read
  id-token: write

jobs:
  publish-interface:
    name: Publish automas-maafw-interface
    if: inputs.package == 'automas-maafw-interface'
    runs-on: ubuntu-latest
    environment: pypi-interface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build packages/automas_maafw_interface --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-agent-env:
    name: Publish automas-maafw-agent-env
    if: inputs.package == 'automas-maafw-agent-env'
